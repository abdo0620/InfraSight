<!DOCTYPE html>
<html lang="en" data-mode="citizen">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portal</title>
  <link rel="stylesheet" href="src/styles/main.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="splash" class="splash is-visible" data-mode="citizen">
 <img class="splash-logo" src="assets/logo.svg" alt="Portal">
</div>
  <header class="topbar">
    <div class="brand">Portal</div>
    <div class="mode-switch">
      <span id="label-citizen">Citizen</span>
      <button class="track" id="mode-toggle" aria-label="Switch mode"></button>
      <span id="label-municipal">Municipal</span>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
